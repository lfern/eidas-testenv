[package]
name = "portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "AdES signing demo portal (Axum + ades-rs)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# CAdES B-B/B-T/B-LT signing over the identities `ca bootstrap` already
# produces. Default features (cades/pades/soft) plus "tsp" (B-T:
# `ades::tsp::TspClient`, fetches a timestamp from the `tsa` responder)
# and "ocsp" (B-LT: `ades::ocsp::OcspClient`, fetches revocation data
# from the `ocsp` responder). `ades::levels::add_signature_timestamp`/
# `add_revocation_values` that embed both are always available,
# unconditional in ades-rs.
ades-rs = { version = "0.2", features = ["tsp", "ocsp"] }
# Extracts the raw SignatureValue from the CAdES B-B CMS produced by
# `ades::cades::sign` — RFC 3161 §2.4.1 requires the TSA's messageImprint
# to hash exactly that (not the original document), and `ades-rs`
# doesn't hand it back separately. Same version `ades-rs` itself pins
# (see its Cargo.lock entry), so no duplicate major version in the tree.
cms = "0.2"
# Unwraps the `BasicOCSPResponse` from inside the `OCSPResponse` envelope
# `ades::ocsp::OcspClient::raw_response` returns —
# `ades::levels::add_revocation_values` wants only the inner bytes, not
# the envelope. Same version already resolved elsewhere in the workspace
# (`tsa`/`ocsp` crates), no duplicate major version in the tree.
der = { version = "0.7", features = ["derive", "alloc"] }
# Parses `<ca-dir>/<role>/cert.pem` (PEM -> DER) to hand to
# `ades::signer::SoftSigner::from_parts`/`from_ec_parts`. Default features
# only (no "builder": portal never constructs certificates, only reads the
# ones `ca` already wrote).
x509-cert = "=0.2.5"
# Loads the RSA-2048 signing key (PEM -> RsaPrivateKey), same version `ca`
# pins. "getrandom" is needed only by tests (they generate throwaway
# in-memory identities instead of shelling out to `ca bootstrap`).
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
# Loads the P-256 signing key (PEM -> SigningKey); "pkcs8" feature for
# `from_pkcs8_pem`, same declaration `ca` already uses.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local browser UI (upload a file, pick a cert, sign). Trimmed to the
# minimal feature set actually used, same as `wallet`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
